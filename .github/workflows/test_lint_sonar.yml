name: Lint, Test, and SonarQube Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dev dependencies
        run: |
          pip install uv ruff
      - name: Run linter
        run: make lint

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install uv
          make install
      - name: Run tests with coverage
        run: |
          make test-coverage
          ls -la coverage.xml
          cat coverage.xml | head -20
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=python-project-50
            -Dsonar.organization=victoria-fedorenko
            -Dsonar.sources=gendiff
            -Dsonar.verbose=true  
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
